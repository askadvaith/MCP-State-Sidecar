[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "mcp-state-sidecar"
version = "0.1.0"
description = "MCP State Sidecar — durable state persistence for multi-agent AI workflows"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "MCP State Sidecar Contributors"}
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = [
    "fastmcp>=0.4.1",
    "aiosqlite>=0.19.0",
    "pydantic>=2.0",
]

[project.optional-dependencies]
redis = ["redis>=5.0.0"]

[project.scripts]
mcp-state-sidecar = "mcp_state_sidecar.server:stdio_main"
mcp-state-sidecar-http = "mcp_state_sidecar.server:main"

[tool.hatch.build.targets.wheel]
packages = ["mcp_state_sidecar"]
